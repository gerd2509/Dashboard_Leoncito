<div class="rk-wrap">
  <!-- ════ REGISTRO ════ -->
  <div class="rk-card">
    <div class="rk-head">
      <mat-icon>hub</mat-icon>
      <div><b>Registro de Gestión KOMMO</b><small>Se guarda directo en base de datos</small></div>
    </div>

    <!-- Canal (según permisos: admin elige; Call/Realzza fijo) -->
    <div class="rk-canal" *ngIf="puedeElegirCanal">
      <button [class.on]="canal === 'LEONCITO'" (click)="setCanal('LEONCITO')"><mat-icon>headset_mic</mat-icon> Leoncito (Call)</button>
      <button class="rz" [class.on]="canal === 'REALZZA'" (click)="setCanal('REALZZA')"><mat-icon>storefront</mat-icon> Realzza</button>
    </div>
    <div class="rk-canal-fijo" *ngIf="!puedeElegirCanal" [class.rz]="canal === 'REALZZA'">
      <mat-icon>{{ canal === 'REALZZA' ? 'storefront' : 'headset_mic' }}</mat-icon>
      Canal: <b>{{ canal === 'REALZZA' ? 'Realzza' : 'Leoncito (Call)' }}</b>
    </div>

    <div class="rk-form">
      <!-- Datos base -->
      <div class="rk-grid">
        <div class="rk-field rk-2">
          <label>Asesor *</label>
          <dx-select-box [dataSource]="asesores" [(value)]="f.asesor" [searchEnabled]="true"
            [acceptCustomValue]="true" placeholder="Selecciona o escribe" stylingMode="outlined"></dx-select-box>
        </div>
        <div class="rk-field">
          <label>Sede</label>
          <dx-select-box [dataSource]="sedes" [(value)]="f.sede" [searchEnabled]="true"
            [acceptCustomValue]="true" [showClearButton]="true" stylingMode="outlined"></dx-select-box>
        </div>
        <div class="rk-field">
          <label>Fecha lead asignado</label>
          <dx-date-box [(value)]="fechaLead" type="date" displayFormat="dd/MM/yyyy" [openOnFieldClick]="true"
            [showClearButton]="true" stylingMode="outlined"></dx-date-box>
        </div>

        <div class="rk-field">
          <label>DNI cliente *</label>
          <dx-text-box [(value)]="f.dni_cliente" (onValueChanged)="soloNumeros('dni_cliente', 8)" mode="tel"
            [maxLength]="8" stylingMode="outlined"></dx-text-box>
        </div>
        <div class="rk-field">
          <label>Celular gestionado</label>
          <dx-text-box [(value)]="f.celular_gestionado" (onValueChanged)="soloNumeros('celular_gestionado', 9)" mode="tel"
            [maxLength]="9" stylingMode="outlined"></dx-text-box>
        </div>
        <div class="rk-field rk-2">
          <label>Nombre cliente</label>
          <dx-text-box [(value)]="f.nombre_cliente" stylingMode="outlined"></dx-text-box>
        </div>

        <div class="rk-field">
          <label>Tipo de cliente</label>
          <dx-select-box [dataSource]="tiposCliente" [(value)]="f.tipo_cliente" [showClearButton]="true" stylingMode="outlined"></dx-select-box>
        </div>
        <div class="rk-field">
          <label>Market Place</label>
          <dx-select-box [dataSource]="siNo" [(value)]="f.market_place" stylingMode="outlined"></dx-select-box>
        </div>
        <div class="rk-field">
          <label>Estado de gestión *</label>
          <dx-select-box [dataSource]="estados" [(value)]="f.estado_gestion" stylingMode="outlined"></dx-select-box>
        </div>
      </div>

      <!-- Rama NO CONTACTO -->
      <div class="rk-grid rk-rama" *ngIf="esNoContacto">
        <div class="rk-field rk-2">
          <label>Motivo no contacto *</label>
          <dx-select-box [dataSource]="motivosNoContacto" [(value)]="f.motivo_no_contacto" [acceptCustomValue]="true" stylingMode="outlined"></dx-select-box>
        </div>
      </div>

      <!-- Rama CONTACTO -->
      <div class="rk-grid rk-rama" *ngIf="esContacto">
        <div class="rk-field rk-2">
          <label>Resultado de gestión *</label>
          <dx-select-box [dataSource]="resultados" [(value)]="f.resultado_gestion" stylingMode="outlined"></dx-select-box>
        </div>

        <!-- INTERESADO → Producto + Motivo de interés (ramifica) -->
        <ng-container *ngIf="esInteresado">
          <div class="rk-field">
            <label>Producto de interés</label>
            <dx-select-box [dataSource]="productos" [(value)]="f.producto_interes" [searchEnabled]="true" [acceptCustomValue]="true" [showClearButton]="true" stylingMode="outlined"></dx-select-box>
          </div>
          <div class="rk-field rk-2">
            <label>Motivo de interés</label>
            <dx-select-box [dataSource]="motivosInteres" [(value)]="f.motivo_interes" [acceptCustomValue]="true" [showClearButton]="true" stylingMode="outlined"></dx-select-box>
          </div>
        </ng-container>

        <!-- INTERESADO → AGENDAMIENTO -->
        <ng-container *ngIf="muestraAgend">
          <div class="rk-field">
            <label>Motivo agendamiento</label>
            <dx-select-box [dataSource]="motivosAgend" [(value)]="f.motivo_agendamiento" [acceptCustomValue]="true" stylingMode="outlined"></dx-select-box>
          </div>
          <div class="rk-field">
            <label>Fecha de interés</label>
            <dx-date-box [(value)]="fechaAgend" type="date" displayFormat="dd/MM/yyyy" [openOnFieldClick]="true"
              [showClearButton]="true" stylingMode="outlined"></dx-date-box>
          </div>
          <div class="rk-field">
            <label>Hora aprox.</label>
            <dx-date-box [(value)]="horaAgend" type="time" displayFormat="HH:mm" [openOnFieldClick]="true"
              [showClearButton]="true" stylingMode="outlined"></dx-date-box>
          </div>
          <div class="rk-field rk-3">
            <label>Comentario adicional agendamiento</label>
            <dx-text-area [(value)]="f.comentario_agend" [height]="60" stylingMode="outlined"></dx-text-area>
          </div>
        </ng-container>

        <!-- INTERESADO → DERIVACIÓN -->
        <ng-container *ngIf="muestraDeriv">
          <div class="rk-field">
            <label>Fecha de interés (derivación)</label>
            <dx-date-box [(value)]="fechaDeriv" type="date" displayFormat="dd/MM/yyyy" [openOnFieldClick]="true"
              [showClearButton]="true" stylingMode="outlined"></dx-date-box>
          </div>
          <div class="rk-field">
            <label>Hora aprox. (derivación)</label>
            <dx-date-box [(value)]="horaDeriv" type="time" displayFormat="HH:mm" [openOnFieldClick]="true"
              [showClearButton]="true" stylingMode="outlined"></dx-date-box>
          </div>
          <div class="rk-field rk-3">
            <label>Comentario adicional derivación</label>
            <dx-text-area [(value)]="f.comentario_deriv" [height]="60" stylingMode="outlined"></dx-text-area>
          </div>
        </ng-container>

        <!-- INTERESADO → VENTA NO CONCRETADA -->
        <ng-container *ngIf="muestraNoCierre">
          <div class="rk-field">
            <label>Motivo de no cierre</label>
            <dx-select-box [dataSource]="motivosNoCierre" [(value)]="f.motivo_no_cierre" [acceptCustomValue]="true" stylingMode="outlined"></dx-select-box>
          </div>
          <div class="rk-field rk-2">
            <label>Comentario venta no concretada</label>
            <dx-text-box [(value)]="f.comentario_venta_no_concretada" stylingMode="outlined"></dx-text-box>
          </div>
        </ng-container>

        <!-- NO ATENDIBLE -->
        <ng-container *ngIf="esNoAtendible">
          <div class="rk-field">
            <label>Motivo no atendible</label>
            <dx-select-box [dataSource]="motivosNoAtendible" [(value)]="f.motivo_no_atendible" [acceptCustomValue]="true" stylingMode="outlined"></dx-select-box>
          </div>
          <div class="rk-field rk-2">
            <label>Comentario adicional NA</label>
            <dx-text-box [(value)]="f.comentario_na" stylingMode="outlined"></dx-text-box>
          </div>
        </ng-container>

        <!-- NO INTERESADO -->
        <ng-container *ngIf="esNoInteresado">
          <div class="rk-field">
            <label>Motivo no interés</label>
            <dx-select-box [dataSource]="motivosNoInteres" [(value)]="f.motivo_no_interes" [acceptCustomValue]="true" stylingMode="outlined"></dx-select-box>
          </div>
          <div class="rk-field rk-2">
            <label>Comentario adicional</label>
            <dx-text-box [(value)]="f.comentario_adicional" stylingMode="outlined"></dx-text-box>
          </div>
        </ng-container>
      </div>

      <div class="rk-actions">
        <button class="rk-btn" [disabled]="guardando || !formValido" (click)="registrar()">
          <mat-icon>save</mat-icon> {{ guardando ? 'Guardando…' : 'Registrar gestión' }}
        </button>
      </div>
    </div>
  </div>

  <p class="rk-nota"><mat-icon>info</mat-icon> Para ver y editar las gestiones registradas, entra a <b>Gestión → KOMMO</b>.</p>
</div>
