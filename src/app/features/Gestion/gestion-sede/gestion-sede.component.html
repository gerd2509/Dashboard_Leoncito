
<div class="gk-head">
  <span class="gk-title"><mat-icon>location_city</mat-icon>
    <div><b>Gestión Sede</b><small>Gestión por sede y asesor</small></div>
  </span>
  <div class="gk-actions">
    <form class="gk-filtros" [formGroup]="formGestion">
      <dx-select-box width="180" formControlName="sede" [dataSource]="sedesDisponibles"
          displayExpr="nombre" valueExpr="key" label="Sede" labelMode="floating"
          stylingMode="outlined" [disabled]="bloquearSede" (onValueChanged)="onSedeChanged($event)" />
      <dx-select-box width="220" formControlName="asesor" [dataSource]="asesores"
          label="Asesor" labelMode="floating" stylingMode="outlined"
          [showClearButton]="true" placeholder="Todos" (onValueChanged)="onAsesorChanged($event)" />
      <dx-date-box formControlName="fechaInicio" type="date" [openOnFieldClick]="true" label="Desde"
          labelMode="floating" stylingMode="outlined" width="130" [displayFormat]="'dd/MM/yyyy'" [showClearButton]="true" />
      <dx-date-box formControlName="fechaFin" type="date" [openOnFieldClick]="true" label="Hasta"
          labelMode="floating" stylingMode="outlined" width="130" [displayFormat]="'dd/MM/yyyy'" [showClearButton]="true" />
    </form>
    <button class="gk-btn" (click)="filtrarPorFecha()"><mat-icon>refresh</mat-icon> Actualizar</button>
    <button class="gk-btn excel" (click)="exportar()"><mat-icon>table_view</mat-icon> Excel</button>
  </div>
</div>

<div class="grid-container">
    <div class="grid-overlay" *ngIf="isLoading">
        <app-loading-overlay [inline]="true" [visible]="isLoading" mensaje="Cargando gestión…" icon="store"></app-loading-overlay>
    </div>

    <dx-data-grid id="dataGrid" class="focqus-elevation mt-2" [dataSource]="dataFiltrada"
        [allowColumnReordering]="true" [showBorders]="true" [showColumnLines]="true"
        [showRowLines]="true" [rowAlternationEnabled]="true" (onCellPrepared)="onCellPrepared($event)"
        [hoverStateEnabled]="true" [wordWrapEnabled]="true" [columnAutoWidth]="true"
        [selection]="{ mode: 'single' }">

        <dxo-paging [pageSize]="10"></dxo-paging>
        <dxo-pager [visible]="true" [showPageSizeSelector]="true" [allowedPageSizes]="[10, 25, 50, 100]" />
        <dxo-filter-row [visible]="showFilterRow" [applyFilter]="currentFilter" />

        <dxi-column dataField="Marca temporal"                          caption="Marca Temporal" />
        <dxi-column dataField="TIENDA SEDE"                             caption="Sede" />
        <dxi-column dataField="ASESOR"                                  caption="Asesor" />
        <dxi-column dataField="DNI CLIENTE"                             caption="DNI Cliente" />
        <dxi-column dataField="TIPO DE GESTION"                         caption="Tipo de Gestión" />
        <dxi-column dataField="RESULTADO DE GESTION"                    caption="Resultado de Gestión" />
        <dxi-column dataField='MOTIVOS "CONTACTO EN LA GESTION"'        caption="Motivo Contacto" />
        <dxi-column dataField='MOTIVOS "NO CONTACTO EN LA GESTION"'     caption="Motivo No Contacto" />
        <dxi-column dataField="PRODUCTO DE INTERES"                     caption="Producto de Interés" />
        <dxi-column dataField="VALOR DE LA VENTA"                       caption="Valor Venta" />
        <dxi-column dataField="FECHA DE COMPROMISO O VISITA"            caption="Fecha Compromiso/Visita" />
        <dxi-column dataField="N° CELULAR ACTUALIZADO"                  caption="Celular Actualizado" />
        <dxi-column dataField="DETALLE(COMENTARIO) CONTACTO"           caption="Detalle / Comentario" />

        <dxo-summary>
            <dxi-total-item alignment="right" column="Marca temporal" summaryType="count"
                displayFormat="Registros: {0}" />
        </dxo-summary>

    </dx-data-grid>
</div>
