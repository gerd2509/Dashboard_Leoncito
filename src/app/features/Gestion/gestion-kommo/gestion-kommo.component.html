<div class="gk-wrap">
  <div class="gk-head">
    <span class="gk-title"><mat-icon>public</mat-icon>
      <div><b>Gestión KOMMO</b><small>Desde base de datos · editable</small></div>
    </span>
    <div class="gk-actions">
      <!-- Toggle de canal: solo admin; Call/Realzza queda fijo en su canal -->
      <div class="gk-canal" *ngIf="esAdmin">
        <button [class.on]="filtroCanal === ''" (click)="setFiltroCanal('')">Todos</button>
        <button [class.on]="filtroCanal === 'LEONCITO'" (click)="setFiltroCanal('LEONCITO')">Leoncito</button>
        <button class="rz" [class.on]="filtroCanal === 'REALZZA'" (click)="setFiltroCanal('REALZZA')">Realzza</button>
      </div>
      <span class="gk-canal-fijo" *ngIf="!esAdmin" [class.rz]="scope === 'REALZZA'">
        {{ scope === 'REALZZA' ? 'Realzza' : 'Leoncito' }}
      </span>
      <button class="gk-btn" (click)="cargar()"><mat-icon>refresh</mat-icon> Actualizar</button>
      <button class="gk-btn excel" (click)="exportar()"><mat-icon>table_view</mat-icon> Excel</button>
    </div>
  </div>

  <div class="gk-grid-wrap">
    <app-loading-overlay [inline]="true" [visible]="isLoading" mensaje="Cargando gestiones…" icon="public"></app-loading-overlay>
    <dx-data-grid [dataSource]="registros" keyExpr="id" [showBorders]="true" [rowAlternationEnabled]="true"
      [columnAutoWidth]="true" [hoverStateEnabled]="true" [height]="640"
      (onRowUpdating)="onRowUpdating($event)" (onRowRemoving)="onRowRemoving($event)"
      (onCellPrepared)="onCellPrepared($event)">
      <dxo-scrolling mode="virtual"></dxo-scrolling>
      <dxo-filter-row [visible]="true"></dxo-filter-row>
      <dxo-search-panel [visible]="true" [width]="260" placeholder="Buscar…"></dxo-search-panel>
      <dxo-header-filter [visible]="true"></dxo-header-filter>
      <dxo-column-chooser [enabled]="true"></dxo-column-chooser>
      <dxo-editing mode="popup" [allowUpdating]="true" [allowDeleting]="true" [useIcons]="true">
        <dxo-popup title="Editar gestión KOMMO" [showTitle]="true" [width]="720" [height]="'auto'"></dxo-popup>
        <dxo-form [colCount]="2"></dxo-form>
      </dxo-editing>

      <dxi-column dataField="marca_temporal" caption="Fecha" [allowEditing]="false" [width]="150"></dxi-column>
      <dxi-column dataField="canal" caption="Canal" [width]="100" [allowEditing]="false"></dxi-column>
      <dxi-column dataField="asesor" caption="Asesor" [minWidth]="180"></dxi-column>
      <dxi-column dataField="dni_cliente" caption="DNI" [width]="110"></dxi-column>
      <dxi-column dataField="celular_gestionado" caption="Celular" [width]="110"></dxi-column>
      <dxi-column dataField="nombre_cliente" caption="Cliente" [minWidth]="150"></dxi-column>
      <dxi-column dataField="sede" caption="Sede" [width]="120"></dxi-column>
      <dxi-column dataField="tipo_cliente" caption="Tipo cliente" [width]="120"></dxi-column>
      <dxi-column dataField="estado_gestion" caption="Estado" [width]="120"></dxi-column>
      <dxi-column dataField="resultado_gestion" caption="Resultado" [width]="140"></dxi-column>
      <dxi-column dataField="market_place" caption="MP" [width]="70"></dxi-column>
      <dxi-column dataField="producto_interes" caption="Producto" [width]="140" [visible]="false"></dxi-column>
      <dxi-column dataField="motivo_interes" caption="Motivo interés" [width]="170" [visible]="false"></dxi-column>
      <dxi-column dataField="motivo_agendamiento" caption="Motivo agend." [width]="150" [visible]="false"></dxi-column>
      <dxi-column dataField="motivo_no_interes" caption="Motivo no interés" [width]="160" [visible]="false"></dxi-column>
      <dxi-column dataField="motivo_no_atendible" caption="Motivo no atendible" [width]="170" [visible]="false"></dxi-column>
      <dxi-column dataField="motivo_no_contacto" caption="Motivo no contacto" [width]="170" [visible]="false"></dxi-column>
      <dxi-column dataField="comentario_adicional" caption="Comentario" [width]="180" [visible]="false"></dxi-column>
      <dxi-column dataField="motivo_no_cierre" caption="Motivo no cierre (RZ)" [width]="180" [visible]="false"></dxi-column>
      <dxi-column dataField="comentario_venta_no_concretada" caption="Coment. venta no concretada" [width]="200" [visible]="false"></dxi-column>
      <dxi-column dataField="fecha_lead_asignado" caption="Fecha lead" [width]="120" [visible]="false"></dxi-column>
      <dxi-column dataField="origen" caption="Origen" [width]="100" [allowEditing]="false"></dxi-column>
    </dx-data-grid>
  </div>
</div>
