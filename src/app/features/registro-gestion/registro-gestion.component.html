<div class="rg-wrap">

  <!-- Encabezado -->
  <header class="rg-head">
    <div class="rg-title">
      <mat-icon>assignment_turned_in</mat-icon>
      <div>
        <h2>Registro de Gestión<span *ngIf="canal === 'realzza'"> — Realzza</span><span *ngIf="canal === 'call'"> — Call Center</span></h2>
        <span *ngIf="canal === 'realzza' && rz.asesor">{{ rz.asesor }}</span>
        <span *ngIf="canal === 'call' && call.asesor">{{ call.asesor }}</span>
        <span *ngIf="canal === 'sede'">Reporte de gestión del equipo comercial</span>
      </div>
    </div>
  </header>

  <!-- ── Selector de canal (admin/supervisor) ── -->
  <div class="rg-canal" *ngIf="elegirCanal && !guardado">
    <button [class.on]="canal === 'sede'" (click)="setCanalManual('sede')"><mat-icon>location_city</mat-icon> Sede</button>
    <button [class.on]="canal === 'call'" (click)="setCanalManual('call')"><mat-icon>headset_mic</mat-icon> Call</button>
    <button class="rz" [class.on]="canal === 'realzza'" (click)="setCanalManual('realzza')"><mat-icon>storefront</mat-icon> Realzza</button>
  </div>

  <!-- ── Pantalla de éxito ── -->
  <div class="rg-ok" *ngIf="guardado">
    <div class="ok-ico"><mat-icon>check_circle</mat-icon></div>
    <h3>¡Gestión registrada!</h3>
    <p>Se guardó correctamente.</p>
    <button class="btn primary grande" (click)="registrarOtra()"><mat-icon>add</mat-icon> Registrar otra</button>
  </div>

  <!-- ── Formulario (una página, estilo KOMMO) ── -->
  <ng-container *ngIf="!guardado">

    <!-- ══════════ SEDE ══════════ -->
    <div class="rg-grid" *ngIf="canal === 'sede'">
      <div class="rg-field" *ngIf="!sedeFija">
        <label>Sede *</label>
        <dx-select-box [dataSource]="sedes" displayExpr="nombre" [value]="modelo.sede" [searchEnabled]="true"
          (onSelectionChanged)="$event.selectedItem && seleccionarSede($event.selectedItem)" placeholder="Selecciona…" stylingMode="outlined"></dx-select-box>
      </div>
      <div class="rg-field">
        <label>Asesor *</label>
        <dx-text-box *ngIf="asesorFijo" [value]="modelo.asesor" [readOnly]="true" stylingMode="outlined"></dx-text-box>
        <dx-select-box *ngIf="!asesorFijo" [dataSource]="asesores" [(value)]="modelo.asesor" [searchEnabled]="true" [acceptCustomValue]="true"
          [placeholder]="cargandoAsesores ? 'Cargando…' : 'Selecciona…'" stylingMode="outlined"></dx-select-box>
      </div>
      <div class="rg-field">
        <label>DNI cliente *</label>
        <dx-text-box [(value)]="modelo.dni_cliente" (onValueChanged)="modelo.dni_cliente = soloNum(modelo.dni_cliente, 8)" mode="tel" [maxLength]="8" stylingMode="outlined"></dx-text-box>
      </div>
      <div class="rg-field">
        <label>Tipo de gestión *</label>
        <dx-select-box [dataSource]="tipos" [(value)]="modelo.tipo_gestion" stylingMode="outlined"></dx-select-box>
      </div>
      <div class="rg-field">
        <label>Resultado *</label>
        <dx-select-box [dataSource]="['CONTACTO','NO CONTACTO']" [(value)]="modelo.resultado" (onValueChanged)="onResultadoChange()" stylingMode="outlined"></dx-select-box>
      </div>
      <div class="rg-field" *ngIf="sMotivoContacto">
        <label>Motivo contacto *</label>
        <dx-select-box [dataSource]="motivosContacto" [(value)]="modelo.motivo_contacto" (onValueChanged)="onMotivoContactoChange()" stylingMode="outlined"></dx-select-box>
      </div>
      <div class="rg-field" *ngIf="sNoContacto">
        <label>Motivo no contacto *</label>
        <dx-select-box [dataSource]="motivosNoContacto" [(value)]="modelo.motivo_no_contacto" [acceptCustomValue]="true" stylingMode="outlined"></dx-select-box>
      </div>
      <ng-container *ngIf="sFormulario">
        <div class="rg-field"><label>Fecha compromiso/visita *</label>
          <dx-date-box type="date" [(value)]="modelo.fecha_compromiso" displayFormat="dd/MM/yyyy" dateSerializationFormat="yyyy-MM-dd" [openOnFieldClick]="true" stylingMode="outlined"></dx-date-box></div>
        <div class="rg-field"><label>Valor de la venta *</label>
          <dx-number-box [(value)]="$any(modelo).valor_venta" format="S/ #,##0.00" [min]="0" stylingMode="outlined"></dx-number-box></div>
        <div class="rg-field rg-3"><label>Producto de interés *</label>
          <dx-select-box [dataSource]="productos" [(value)]="modelo.producto_interes" [searchEnabled]="true" stylingMode="outlined"></dx-select-box></div>
      </ng-container>
      <ng-container *ngIf="sDetalle">
        <div class="rg-field rg-2"><label>Detalle (comentario) *</label>
          <dx-text-area [(value)]="modelo.detalle_contacto" [height]="60" stylingMode="outlined"></dx-text-area></div>
        <div class="rg-field"><label>Celular actualizado *</label>
          <dx-text-box [(value)]="modelo.celular_actualizado" (onValueChanged)="modelo.celular_actualizado = soloNum(modelo.celular_actualizado, 9)" mode="tel" [maxLength]="9" stylingMode="outlined"></dx-text-box></div>
      </ng-container>
    </div>

    <!-- ══════════ REALZZA ══════════ -->
    <div class="rg-grid" *ngIf="canal === 'realzza'">
      <div class="rg-field rg-2">
        <label>Asesor Realzza *</label>
        <dx-select-box [dataSource]="asesoresRealzza" [(value)]="rz.asesor" [searchEnabled]="true" [acceptCustomValue]="true"
          [disabled]="!elegirCanal" placeholder="Selecciona…" stylingMode="outlined"></dx-select-box>
      </div>
      <div class="rg-field"><label>DNI cliente *</label>
        <dx-text-box [(value)]="rz.dni_cliente" (onValueChanged)="rz.dni_cliente = soloNum(rz.dni_cliente, 8)" mode="tel" [maxLength]="8" stylingMode="outlined"></dx-text-box></div>
      <div class="rg-field"><label>Celular gestionado *</label>
        <dx-text-box [(value)]="rz.celular_gestionado" (onValueChanged)="rz.celular_gestionado = soloNum(rz.celular_gestionado, 9)" mode="tel" [maxLength]="9" stylingMode="outlined"></dx-text-box></div>
      <div class="rg-field"><label>Tipo de base *</label>
        <dx-select-box [dataSource]="rzTipoBase" [(value)]="rz.tipo_base" stylingMode="outlined"></dx-select-box></div>
      <div class="rg-field"><label>Estado de gestión *</label>
        <dx-select-box [dataSource]="['CONTACTO','NO CONTACTO']" [(value)]="rz.estado_gestion" (onValueChanged)="onRzEstadoChange()" stylingMode="outlined"></dx-select-box></div>
      <div class="rg-field" *ngIf="rzNoCont"><label>Motivo no contacto *</label>
        <dx-select-box [dataSource]="rzMotivoNoContacto" [(value)]="rz.motivo_no_contacto" stylingMode="outlined"></dx-select-box></div>
      <ng-container *ngIf="rzCont">
        <div class="rg-field"><label>Medio primer contacto *</label>
          <dx-select-box [dataSource]="rzMedio" [(value)]="rz.medio_primer_contacto" stylingMode="outlined"></dx-select-box></div>
        <div class="rg-field"><label>Resultado de gestión *</label>
          <dx-select-box [dataSource]="rzResultado" [(value)]="rz.resultado_gestion" (onValueChanged)="onRzResultadoChange()" stylingMode="outlined"></dx-select-box></div>
      </ng-container>
      <ng-container *ngIf="rzInteres">
        <div class="rg-field"><label>Producto interés *</label>
          <dx-select-box [dataSource]="rzProductos" [(value)]="rz.producto_interes" [searchEnabled]="true" stylingMode="outlined"></dx-select-box></div>
        <div class="rg-field rg-2"><label>Motivo interés *</label>
          <dx-select-box [dataSource]="rzMotivoInteres" [(value)]="rz.motivo_interes" (onValueChanged)="onRzMotivoInteresChange()" stylingMode="outlined"></dx-select-box></div>
      </ng-container>
      <ng-container *ngIf="rzDeriv">
        <div class="rg-field"><label>Fecha derivación *</label>
          <dx-date-box type="date" [(value)]="rz.fecha_interes_derivacion" displayFormat="dd/MM/yyyy" dateSerializationFormat="yyyy-MM-dd" [openOnFieldClick]="true" stylingMode="outlined"></dx-date-box></div>
        <div class="rg-field"><label>Hora *</label>
          <input class="rg-time" type="time" [(ngModel)]="rz.hora_interes_derivacion"></div>
        <div class="rg-field"><label>Comentario *</label>
          <dx-text-box [(value)]="rz.comentario_derivacion" stylingMode="outlined"></dx-text-box></div>
      </ng-container>
      <ng-container *ngIf="rzAgend">
        <div class="rg-field"><label>Motivo agendamiento *</label>
          <dx-select-box [dataSource]="rzMotivoAgendamiento" [(value)]="rz.motivo_agendamiento" stylingMode="outlined"></dx-select-box></div>
        <div class="rg-field"><label>Fecha *</label>
          <dx-date-box type="date" [(value)]="rz.fecha_interes_agendamiento" displayFormat="dd/MM/yyyy" dateSerializationFormat="yyyy-MM-dd" [openOnFieldClick]="true" stylingMode="outlined"></dx-date-box></div>
        <div class="rg-field"><label>Hora *</label>
          <input class="rg-time" type="time" [(ngModel)]="rz.hora_interes_agendamiento"></div>
        <div class="rg-field rg-3"><label>Comentario *</label>
          <dx-text-area [(value)]="rz.comentario_agendamiento" [height]="56" stylingMode="outlined"></dx-text-area></div>
      </ng-container>
      <ng-container *ngIf="rzNoConcret">
        <div class="rg-field"><label>Motivo de no cierre *</label>
          <dx-select-box [dataSource]="rzMotivoNoCierre" [(value)]="rz.motivo_no_cierre" stylingMode="outlined"></dx-select-box></div>
        <div class="rg-field rg-2"><label>Comentario venta no concretada *</label>
          <dx-text-box [(value)]="rz.comentario_venta_no_concretada" stylingMode="outlined"></dx-text-box></div>
      </ng-container>
      <ng-container *ngIf="rzNoInt">
        <div class="rg-field"><label>Motivo no interés *</label>
          <dx-select-box [dataSource]="rzMotivoNoInteres" [(value)]="rz.motivo_no_interes" stylingMode="outlined"></dx-select-box></div>
        <div class="rg-field rg-2"><label>Comentario *</label>
          <dx-text-box [(value)]="rz.comentario_no_interes" stylingMode="outlined"></dx-text-box></div>
      </ng-container>
      <ng-container *ngIf="rzNoAtend">
        <div class="rg-field"><label>Motivo no atendible *</label>
          <dx-select-box [dataSource]="rzMotivoNoAtendible" [(value)]="rz.motivo_no_atendible" stylingMode="outlined"></dx-select-box></div>
        <div class="rg-field rg-2"><label>Comentario *</label>
          <dx-text-box [(value)]="rz.comentario_no_atendible" stylingMode="outlined"></dx-text-box></div>
      </ng-container>
      <div class="rg-field rg-2" *ngIf="rzTerc"><label>Motivos tercero relacionado *</label>
        <dx-select-box [dataSource]="rzMotivosTercero" [(value)]="rz.motivos_tercero_relacionado" (onValueChanged)="onRzTerceroChange()" stylingMode="outlined"></dx-select-box></div>
      <ng-container *ngIf="rzTercAgenda">
        <div class="rg-field"><label>Fecha re-llamada *</label>
          <dx-date-box type="date" [(value)]="rz.fecha_rellamada" displayFormat="dd/MM/yyyy" dateSerializationFormat="yyyy-MM-dd" [openOnFieldClick]="true" stylingMode="outlined"></dx-date-box></div>
        <div class="rg-field"><label>Hora re-llamada *</label>
          <input class="rg-time" type="time" [(ngModel)]="rz.hora_rellamada"></div>
        <div class="rg-field"><label>N° titular actual *</label>
          <dx-text-box [(value)]="rz.numero_titular_actual" (onValueChanged)="rz.numero_titular_actual = soloNum(rz.numero_titular_actual, 9)" mode="tel" [maxLength]="9" stylingMode="outlined"></dx-text-box></div>
      </ng-container>
    </div>

    <!-- ══════════ CALL CENTER ══════════ -->
    <div class="rg-grid" *ngIf="canal === 'call'">
      <div class="rg-field rg-2">
        <label>Asesor Call *</label>
        <dx-select-box [dataSource]="asesoresCall" [(value)]="call.asesor" [searchEnabled]="true" [acceptCustomValue]="true"
          [disabled]="!elegirCanal" placeholder="Selecciona…" stylingMode="outlined"></dx-select-box>
      </div>
      <div class="rg-field"><label>DNI cliente *</label>
        <dx-text-box [(value)]="call.dni_cliente" (onValueChanged)="call.dni_cliente = soloNum(call.dni_cliente, 8)" mode="tel" [maxLength]="8" stylingMode="outlined"></dx-text-box></div>
      <div class="rg-field"><label>Celular gestionado *</label>
        <dx-text-box [(value)]="call.celular_gestionado" (onValueChanged)="call.celular_gestionado = soloNum(call.celular_gestionado, 9)" mode="tel" [maxLength]="9" stylingMode="outlined"></dx-text-box></div>
      <div class="rg-field"><label>Sede *</label>
        <dx-select-box [dataSource]="callSedes" [(value)]="call.sede" [searchEnabled]="true" stylingMode="outlined"></dx-select-box></div>
      <div class="rg-field"><label>KOMMO *</label>
        <dx-select-box [dataSource]="['SI','NO']" [(value)]="call.kommo" stylingMode="outlined"></dx-select-box></div>
      <div class="rg-field"><label>Tipo de cliente *</label>
        <dx-select-box [dataSource]="callTipoCliente" [(value)]="call.tipo_cliente" [searchEnabled]="true" stylingMode="outlined"></dx-select-box></div>
      <div class="rg-field"><label>Estado de gestión *</label>
        <dx-select-box [dataSource]="['CONTACTO','NO CONTACTO']" [(value)]="call.estado_gestion" (onValueChanged)="onCallEstadoChange()" stylingMode="outlined"></dx-select-box></div>
      <div class="rg-field" *ngIf="cNoCont"><label>Motivo no contacto *</label>
        <dx-select-box [dataSource]="callMotivoNoContacto" [(value)]="call.motivo_no_contacto" stylingMode="outlined"></dx-select-box></div>
      <ng-container *ngIf="cCont">
        <div class="rg-field"><label>Medio primer contacto *</label>
          <dx-select-box [dataSource]="callMedio" [(value)]="call.medio_primer_contacto" stylingMode="outlined"></dx-select-box></div>
        <div class="rg-field"><label>Resultado de gestión *</label>
          <dx-select-box [dataSource]="callResultado" [(value)]="call.resultado_gestion" (onValueChanged)="onCallResultadoChange()" stylingMode="outlined"></dx-select-box></div>
      </ng-container>
      <ng-container *ngIf="cInteres">
        <div class="rg-field"><label>Producto interés *</label>
          <dx-select-box [dataSource]="callProductos" [(value)]="call.producto_interes" [searchEnabled]="true" stylingMode="outlined"></dx-select-box></div>
        <div class="rg-field rg-2"><label>Motivo interés *</label>
          <dx-select-box [dataSource]="callMotivoInteres" [(value)]="call.motivo_interes" (onValueChanged)="onCallMotivoInteresChange()" stylingMode="outlined"></dx-select-box></div>
      </ng-container>
      <ng-container *ngIf="cDeriv">
        <div class="rg-field"><label>Fecha derivación *</label>
          <dx-date-box type="date" [(value)]="call.fecha_interes_derivacion" displayFormat="dd/MM/yyyy" dateSerializationFormat="yyyy-MM-dd" [openOnFieldClick]="true" stylingMode="outlined"></dx-date-box></div>
        <div class="rg-field"><label>Hora *</label>
          <input class="rg-time" type="time" [(ngModel)]="call.hora_interes_derivacion"></div>
        <div class="rg-field"><label>Comentario *</label>
          <dx-text-box [(value)]="call.comentario_derivacion" stylingMode="outlined"></dx-text-box></div>
      </ng-container>
      <ng-container *ngIf="cAgend">
        <div class="rg-field"><label>Motivo agendamiento *</label>
          <dx-select-box [dataSource]="callMotivoAgendamiento" [(value)]="call.motivo_agendamiento" stylingMode="outlined"></dx-select-box></div>
        <div class="rg-field"><label>Fecha *</label>
          <dx-date-box type="date" [(value)]="call.fecha_interes_agendamiento" displayFormat="dd/MM/yyyy" dateSerializationFormat="yyyy-MM-dd" [openOnFieldClick]="true" stylingMode="outlined"></dx-date-box></div>
        <div class="rg-field"><label>Hora *</label>
          <input class="rg-time" type="time" [(ngModel)]="call.hora_interes_agendamiento"></div>
        <div class="rg-field rg-3"><label>Comentario *</label>
          <dx-text-area [(value)]="call.comentario_agendamiento" [height]="56" stylingMode="outlined"></dx-text-area></div>
      </ng-container>
      <ng-container *ngIf="cNoConcret">
        <div class="rg-field"><label>Motivo de no cierre *</label>
          <dx-select-box [dataSource]="callMotivoNoCierre" [(value)]="call.motivo_no_cierre" stylingMode="outlined"></dx-select-box></div>
        <div class="rg-field rg-2"><label>Comentario venta no concretada *</label>
          <dx-text-box [(value)]="call.comentario_venta_no_concretada" stylingMode="outlined"></dx-text-box></div>
      </ng-container>
      <ng-container *ngIf="cNoInt">
        <div class="rg-field"><label>Motivo no interés *</label>
          <dx-select-box [dataSource]="callMotivoNoInteres" [(value)]="call.motivo_no_interes" stylingMode="outlined"></dx-select-box></div>
        <div class="rg-field rg-2"><label>Comentario *</label>
          <dx-text-box [(value)]="call.comentario_no_interes" stylingMode="outlined"></dx-text-box></div>
      </ng-container>
      <ng-container *ngIf="cNoAtend">
        <div class="rg-field"><label>Motivo no atendible *</label>
          <dx-select-box [dataSource]="callMotivoNoAtendible" [(value)]="call.motivo_no_atendible" stylingMode="outlined"></dx-select-box></div>
        <div class="rg-field rg-2"><label>Comentario *</label>
          <dx-text-box [(value)]="call.comentario_no_atendible" stylingMode="outlined"></dx-text-box></div>
      </ng-container>
      <div class="rg-field rg-2" *ngIf="cTerc"><label>Motivos tercero relacionado *</label>
        <dx-select-box [dataSource]="callMotivosTercero" [(value)]="call.motivos_tercero_relacionado" (onValueChanged)="onCallTerceroChange()" stylingMode="outlined"></dx-select-box></div>
      <ng-container *ngIf="cTercAgenda">
        <div class="rg-field"><label>Fecha re-llamada *</label>
          <dx-date-box type="date" [(value)]="call.fecha_rellamada" displayFormat="dd/MM/yyyy" dateSerializationFormat="yyyy-MM-dd" [openOnFieldClick]="true" stylingMode="outlined"></dx-date-box></div>
        <div class="rg-field"><label>Hora re-llamada *</label>
          <input class="rg-time" type="time" [(ngModel)]="call.hora_rellamada"></div>
        <div class="rg-field"><label>N° titular actual *</label>
          <dx-text-box [(value)]="call.numero_titular_actual" (onValueChanged)="call.numero_titular_actual = soloNum(call.numero_titular_actual, 9)" mode="tel" [maxLength]="9" stylingMode="outlined"></dx-text-box></div>
      </ng-container>
    </div>

    <p class="rg-error" *ngIf="error">{{ error }}</p>

    <div class="rg-actions">
      <button class="btn guardar" (click)="guardar()" [disabled]="!formOk || guardando">
        <mat-icon>{{ guardando ? 'hourglass_top' : 'save' }}</mat-icon>
        {{ guardando ? 'Guardando…' : 'Guardar gestión' }}
      </button>
    </div>

  </ng-container>
</div>
